<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <script>
      // Apply persisted theme before paint to prevent FOUC.
      // Mirrors src/hooks/useTheme.ts — keep STORAGE_KEY in sync.
      (function () {
        try {
          var t = localStorage.getItem('wmc:theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var d = '%VITE_PLAUSIBLE_DOMAIN%'
        if (!d || d.charAt(0) === '%') return
        var s = document.createElement('script')
        s.defer = true
        s.setAttribute('data-domain', d)
        s.src = 'https://plausible.io/js/script.js'
        document.head.appendChild(s)
        window.plausible =
          window.plausible ||
          function () {
            ;(window.plausible.q = window.plausible.q || []).push(arguments)
          }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
