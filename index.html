<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Static fallback title; per-route <Head> via react-helmet-async overrides
         this once React hydrates. -->
    <title>WMC | Crop once, post everywhere</title>

    <script>
      // Apply persisted theme before paint to prevent FOUC.
      // Mirrors src/hooks/useTheme.ts — keep STORAGE_KEY in sync.
      (function () {
        try {
          var t = localStorage.getItem('wmc:theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Google Analytics (gtag.js). VITE_GA_ID is substituted at build time; if
      it's empty (e.g. in dev) the early return keeps the snippet a no-op.
      SPA pageviews are tracked by GA4 Enhanced Measurement — make sure
      "Page views > history changes" is on in the GA4 admin.
    -->
    <script>
      (function () {
        var id = '%VITE_GA_ID%'
        if (!id || id.charAt(0) === '%') return
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () {
          window.dataLayer.push(arguments)
        }
        window.gtag('js', new Date())
        window.gtag('config', id)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
